name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run security:audit
      - uses: actions/upload-artifact@v4
        with:
          name: static-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and smoke-test the production container
        shell: bash
        run: |
          docker build --tag local-pdf-reader:${GITHUB_SHA} .
          container_id=$(docker run --detach --publish 127.0.0.1:8080:8080 local-pdf-reader:${GITHUB_SHA})
          trap 'docker rm --force "${container_id}"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet 'Local PDF Reader'
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1
